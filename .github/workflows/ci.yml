name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` also runs `prepare`, which builds dist/.
      - run: npm ci
      - run: npm test # typecheck, then the unit tests
      - run: npm pack --dry-run # what would be published

  release-check:
    name: Release check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff against the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
      - run: npm ci --ignore-scripts
      # No local-path dependencies; and a changed package must carry an unpublished version (released when the PR is merged).
      - run: node scripts/release.mjs check --base origin/${{ github.base_ref }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
