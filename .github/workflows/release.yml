name: Release package

# Publishes the package if its package.json version is not on the registry yet, then tags it and creates a GitHub
# release. To release, bump the version in the pull request; merging it to main publishes.
# A package marked "private" in package.json is skipped, so this does nothing until that is removed.
on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'package-lock.json', 'tsconfig.build.json']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and report without publishing
        type: boolean
        default: false

permissions:
  contents: write # tags and GitHub releases
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes since the previous tag
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
          package-manager-cache: false # no build cache in a publishing job
      - run: npm ci
      - run: npm test
      - run: node scripts/release.mjs publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # Provenance attestations need the public npm registry.
          NPM_PROVENANCE: ${{ vars.NPM_REGISTRY_URL == '' }}
